<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 430" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#141B3C">
  <title id="t">The first pairing of your computer and your server</title>
  <desc id="d">Step 1: you paste your computer's key in DSM. Step 2: your answers and the checked package go to the installer on port 7448. Step 3: the root step installs and starts the daemon. Step 4: your computer pins the daemon's key on port 7447. After that each side checks the other's key on every call.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#141B3C"/></marker>
  </defs>
  <rect x="1" y="1" width="898" height="428" rx="18" fill="#FFFFFF" stroke="#141B3C" stroke-width="2"/>

  <rect x="20" y="30" width="250" height="370" rx="16" fill="#EEF1FB" stroke="#141B3C" stroke-width="2"/>
  <text x="40" y="64" font-size="18" font-weight="700">Your computer</text>
  <rect x="40" y="84" width="210" height="54" rx="10" fill="#2143E6" stroke="#141B3C" stroke-width="2"/>
  <text x="56" y="116" font-family="ui-monospace, Menlo, Consolas, monospace" fill="#FFFFFF">$ syrvis install</text>
  <rect x="40" y="160" width="210" height="84" rx="10" fill="#FFD23F" stroke="#141B3C" stroke-width="2"/>
  <text x="54" y="188" font-size="14" font-weight="700">Your computer's key</text>
  <text x="54" y="209">made here; only the public</text>
  <text x="54" y="227">half ever leaves</text>
  <rect x="40" y="268" width="210" height="84" rx="10" fill="#FFFFFF" stroke="#141B3C" stroke-width="2"/>
  <text x="54" y="296" font-size="14" font-weight="700">The daemon's key, pinned</text>
  <text x="54" y="317">checked on every call</text>
  <text x="54" y="335">from now on</text>

  <rect x="620" y="30" width="260" height="370" rx="16" fill="#EEF1FB" stroke="#141B3C" stroke-width="2"/>
  <text x="640" y="64" font-size="18" font-weight="700">Your server</text>
  <rect x="640" y="84" width="220" height="100" rx="10" fill="#FFD23F" stroke="#141B3C" stroke-width="2"/>
  <text x="654" y="112" font-size="14" font-weight="700">The installer</text>
  <text x="654" y="133">a small DSM package</text>
  <text x="654" y="151">port 7448</text>
  <text x="654" y="169">pairs once, then stops</text>
  <rect x="640" y="268" width="220" height="100" rx="10" fill="#2FD3A0" stroke="#141B3C" stroke-width="2"/>
  <text x="654" y="296" font-size="14" font-weight="700">SyrvisCore</text>
  <text x="654" y="317">the daemon that runs</text>
  <text x="654" y="335">your services</text>
  <text x="654" y="353">port 7447</text>
  <line x1="700" y1="184" x2="700" y2="264" stroke="#141B3C" stroke-width="2" marker-end="url(#a)"/>
  <circle cx="700" cy="222" r="13" fill="#E8472A" stroke="#141B3C" stroke-width="2"/>
  <text x="700" y="227" text-anchor="middle" font-weight="700" fill="#FFFFFF">3</text>
  <text x="722" y="218">the root step:</text>
  <text x="722" y="236">you press Run</text>

  <text x="445" y="100" text-anchor="middle">You paste the key in DSM</text>
  <line x1="270" y1="118" x2="636" y2="118" stroke="#141B3C" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#a)"/>
  <circle cx="445" cy="118" r="13" fill="#E8472A" stroke="#141B3C" stroke-width="2"/>
  <text x="445" y="123" text-anchor="middle" font-weight="700" fill="#FFFFFF">1</text>
  <line x1="274" y1="164" x2="636" y2="164" stroke="#141B3C" stroke-width="2" marker-start="url(#a)" marker-end="url(#a)"/>
  <circle cx="445" cy="164" r="13" fill="#E8472A" stroke="#141B3C" stroke-width="2"/>
  <text x="445" y="169" text-anchor="middle" font-weight="700" fill="#FFFFFF">2</text>
  <text x="445" y="196" text-anchor="middle">Your answers and the checked package</text>

  <text x="445" y="296" text-anchor="middle">Your computer pins the daemon's key</text>
  <line x1="274" y1="314" x2="636" y2="314" stroke="#2143E6" stroke-width="3" marker-start="url(#a)" marker-end="url(#a)"/>
  <circle cx="445" cy="314" r="13" fill="#E8472A" stroke="#141B3C" stroke-width="2"/>
  <text x="445" y="319" text-anchor="middle" font-weight="700" fill="#FFFFFF">4</text>
  <text x="445" y="346" text-anchor="middle">After this, each side checks the</text>
  <text x="445" y="364" text-anchor="middle">other's key on every call</text>
</svg>
